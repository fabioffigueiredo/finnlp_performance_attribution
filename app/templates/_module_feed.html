<div class="topbar">
  <div>
    <div class="page-h">Feed de Notícias</div>
    <div class="page-desc">Scraping RSS manual dos portais selecionados, com classificação de sentimento</div>
  </div>
  <div class="topbar-actions">
    <button id="feed-fetch" class="btn btn-primary">Buscar agora</button>
  </div>
</div>

<div class="content-area">
  <div class="card">
    <div class="card-label">Portais ativos</div>
    <div class="portal-chips" id="feed-portals" style="margin-left:0"></div>
  </div>

  <div class="stream-panel">
    <div class="stream-header">
      <div class="section-h" style="margin:0;font-size:10px">Resultados</div>
      <span class="muted" id="feed-count" style="margin-left:auto;font-size:11px"></span>
    </div>
    <div class="stream-body" id="feed-results">
      <div class="news-item"><div class="muted" style="font-size:12px">Clique em "Buscar agora" para coletar notícias dos portais.</div></div>
    </div>
  </div>
</div>
